{% extends "base.html" %}
{% block title %}{{ '编辑记录' if record else '记一笔' }}{% endblock %}
{% block content %}
<h1>{{ '编辑记录' if record else '记一笔' }}</h1>
<form method="post" class="card trip-form">
  <div class="form-row">
    <div class="field">
      <label>收支</label>
      <select name="kind" id="exp-kind">
        {% for k in kinds %}
        <option value="{{ k }}" {% if (record.kind if record else '支出') == k %}selected{% endif %}>{{ k }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>日期</label>
      <input type="date" name="date" value="{{ record.date.isoformat() if record else today.isoformat() }}" required>
    </div>
    <div class="field">
      <label>金额</label>
      <input type="number" step="0.01" min="0" name="amount" value="{{ record.amount if record else '' }}" required>
    </div>
  </div>
  <div class="form-row">
    <div class="field">
      <label>一级分类</label>
      <select id="exp-cat1"></select>
    </div>
    <div class="field">
      <label>二级分类</label>
      <select id="exp-cat2" name="category_id"></select>
    </div>
    <div class="field">
      <label>标签（可留空/新建）</label>
      <input type="text" name="tag_name" value="{{ record.tag.name if record and record.tag else '' }}" placeholder="如：超市" list="exp-tag-options">
      <datalist id="exp-tag-options">
        {% for t in tags %}<option value="{{ t.name }}">{% endfor %}
      </datalist>
    </div>
  </div>
  <label>备注</label>
  <textarea name="note">{{ record.note or '' if record else '' }}</textarea>
  <button class="btn" type="submit" style="margin-top: 0.8rem">保存</button>
  <a class="btn btn-ghost" href="{{ url_for('expenses.list') }}">取消</a>
</form>
{% endblock %}

{% block scripts %}
<script>
const CATEGORIES = {{ categories_json | safe }};
const CUR_KIND = {{ (record.kind if record else '支出') | tojson }};
const CUR_CAT1_ID = {{ (record.category.parent_id if record and record.category.parent_id else (record.category.id if record else None)) | tojson }};
const CUR_CAT2_ID = {{ (record.category_id if record else None) | tojson }};

const kindSelect = document.getElementById('exp-kind');
const cat1Select = document.getElementById('exp-cat1');
const cat2Select = document.getElementById('exp-cat2');

function renderCat1() {
  const kind = kindSelect.value;
  cat1Select.innerHTML = '';
  CATEGORIES.filter(c => c.kind === kind).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = (c.icon || '') + ' ' + c.name;
    cat1Select.appendChild(opt);
  });
  if (kind === CUR_KIND && CUR_CAT1_ID) cat1Select.value = CUR_CAT1_ID;
  renderCat2();
}

function renderCat2() {
  const top = CATEGORIES.find(c => String(c.id) === cat1Select.value);
  cat2Select.innerHTML = '';
  if (top) {
    const self = document.createElement('option');
    self.value = top.id; self.textContent = '（不细分）';
    cat2Select.appendChild(self);
    top.children.forEach(sub => {
      const opt = document.createElement('option');
      opt.value = sub.id; opt.textContent = (sub.icon ? sub.icon + ' ' : '') + sub.name;
      cat2Select.appendChild(opt);
    });
  }
  if (kindSelect.value === CUR_KIND && CUR_CAT2_ID) cat2Select.value = CUR_CAT2_ID;
}

kindSelect.addEventListener('change', renderCat1);
cat1Select.addEventListener('change', renderCat2);
renderCat1();
</script>
{% endblock %}
