{% extends "base.html" %}
{% block title %}导入记账文件{% endblock %}
{% block content %}
<h1>导入记账文件</h1>
<p class="muted">支持记账 App 导出的 .xls（含「支出」「收入」两个 sheet）。已导入过的记录按日期/分类/金额/商家/备注自动识别并跳过，可放心重复上传。</p>
<form method="post" enctype="multipart/form-data" class="card">
  <label>选择 .xls 文件</label>
  <input type="file" name="file" accept=".xls" required>
  <button class="btn" type="submit" style="margin-top: 0.6rem">上传并导入</button>
</form>

<div class="card">
  <h3>重刷指纹</h3>
  <p class="muted">改过分类名/标签名之后，老记录的去重指纹会跟不上；重刷会按当前分类/标签重新计算所有记录（含手工记录）的指纹，不影响记录内容本身。</p>
  <form method="post" action="{{ url_for('expenses.refresh_fingerprints') }}">
    <button class="btn" type="submit">重刷所有指纹</button>
  </form>
</div>

<div class="card" style="border-color: #e76f51">
  <h3 style="color: #e76f51">危险操作</h3>
  <p class="muted">清空后记录无法恢复，请谨慎操作。</p>
  <form method="post" action="{{ url_for('expenses.clear') }}" class="form-row"
        onsubmit="return confirm('确定清空所选范围内的日常消费记录？此操作不可恢复！');">
    <div class="field">
      <label>清空范围</label>
      <select name="year">
        <option value="">全部年份</option>
        {% for y in data_years %}
        <option value="{{ y }}">仅 {{ y }} 年</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn btn-danger" type="submit" style="align-self: flex-end">清空</button>
  </form>
</div>
{% endblock %}
